# Configuration Cloudflare Pages — ABCD Ingénierie
#
# Le site publié est le contenu statique de `site/` (pas de build : les pages
# HTML sont versionnées telles quelles) et les routes dynamiques sont dans
# `functions/`, à la racine du dépôt.
#
# Ce fichier n'est pas obligatoire lorsque le projet est relié à GitHub et
# configuré depuis le tableau de bord, mais il permet de lancer le site en
# local avec `npx wrangler pages dev` et de garder la configuration dans le
# dépôt. Le nom du projet doit correspondre à celui créé sur Cloudflare.

name = "abcd-ing"
compatibility_date = "2026-10-06"
pages_build_output_dir = "site"

# Variables lues par functions/api/contact.js. Elles sont ici, et non dans le
# tableau de bord, parce que `wrangler pages deploy` réécrit la configuration
# de l'environnement de production à chaque envoi : toute variable « texte »
# posée à la main serait effacée au déploiement suivant. Déclarées ici, elles
# sont reposées automatiquement à chaque envoi.
#
# La clé Brevo, elle, est un secret : elle reste dans le tableau de bord
# (Settings → Environment variables, Production et Preview) et n'a rien à
# faire dans un fichier versionné. Deux raisons, pas une : ce dépôt est
# public, donc tout ce qui y est écrit est lisible par n'importe qui, et ce
# fichier fait autorité sur les champs qu'il déclare — y inscrire la clé la
# publierait et verrouillerait le champ correspondant dans le tableau de bord,
# qui ne pourrait plus accueillir la vraie valeur.
[vars]
CONTACT_TO = "contact@abcd-ing.fr"
CONTACT_FROM = "Formulaire abcd-ing.fr <contact@abcd-ing.fr>"
